# nginx config for the FlowBoard web SPA (production).
#
# Three jobs: serve the static Vite bundle with correct caching, fall back to
# index.html so client-side routing works on a hard refresh, and proxy the API
# and Socket.IO traffic to the `api` service so the browser talks to a SINGLE
# ORIGIN (no CORS, no cookie-domain juggling, no websocket origin checks).

# `api` is the service name in docker-compose.yml, resolved by Compose's
# embedded DNS on the private network. The API is deliberately NOT published to
# the host — this proxy is the only route to it.
upstream flowboard_api {
    server api:4000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the exact nginx version in responses and error pages.
    server_tokens off;

    # The bundle is served straight from disk and never sniffed for a type.
    # Repeated inside the two locations below that declare their own
    # `add_header`: nginx REPLACES the inherited set rather than adding to it,
    # so a child block with any add_header silently drops every parent one.
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/woff font/woff2;

    # REST API -> Express.
    #
    # `proxy_pass` has no URI part on purpose, so the original `/api/…` path is
    # forwarded verbatim — Express mounts its router at `/api`.
    location /api/ {
        proxy_pass http://flowboard_api;
        proxy_http_version 1.1;
        # nginx's 1 MB default is smaller than a legitimate request here: a task
        # description with inline content, or a bulk reorder, can exceed it, and
        # the rejection is a bare 413 the client cannot explain. File uploads do
        # NOT pass through nginx — the browser PUTs them straight to S3 via a
        # presigned URL — so this ceiling only ever bounds JSON.
        client_max_body_size 5m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO -> Express, with the websocket upgrade and long-lived reads.
    # The two `proxy_*_timeout`s matter: nginx's 60s default would sever an idle
    # board connection, and the client would reconnect every minute.
    location /socket.io/ {
        proxy_pass http://flowboard_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        # Socket.IO falls back to HTTP long-polling when a websocket cannot be
        # established (corporate proxies, some mobile networks). Buffering would
        # hold each poll response until the buffer filled or the upstream
        # closed, which turns realtime updates into multi-second stalls on
        # exactly the connections that are already degraded.
        proxy_buffering off;
    }

    # Hashed build output. The filename changes whenever the content does, so
    # these can be cached for a year and never revalidated — which is what makes
    # the vendor chunking in vite.config.ts pay off across deploys.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The app shell is NOT hashed and is the document that names every hashed
    # asset, so it must never be cached: a stale index.html points an open tab at
    # chunks that no longer exist (see `lib/chunk-recovery`).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        expires 0;
    }

    # SPA fallback: every other path serves the app shell so a deep link like
    # /o/acme/p/FB/board/t/FB-142 reaches the router instead of a 404.
    #
    # The final `/index.html` is a URI, not a file path, so nginx performs an
    # INTERNAL REDIRECT and re-runs location matching — which lands on the
    # `= /index.html` block above and picks up its no-store headers. A deep link
    # is therefore cached exactly as conservatively as a root request.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
